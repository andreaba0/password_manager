version: "3.8"

services:
    # 1. Postgres Database
    postgres:
        image: database:latest # Uses your locally built image
        container_name: test_postgres
        environment:
            POSTGRES_USER: test_user
            POSTGRES_PASSWORD: test_password
            POSTGRES_DB: test_db
        ports:
            - "5432:5432"
        networks:
            - integration_net
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 2s

    # 2. Valkey Cache
    valkey:
        image: cache:latest # Uses your locally built image
        container_name: test_valkey
        ports:
            - "6379:6379"
        networks:
            - integration_net
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    # 3. Go REST API Server
    backend:
        image: backend:latest # Uses your locally built image
        container_name: test_backend
        ports:
            - "8080:8080"
        environment:
            - DB_HOST=postgres
            - DB_PORT=5432
            - DB_USER=test_user
            - DB_PASSWORD=test_password
            - DB_NAME=test_db
            - VALKEY_HOST=valkey
            - VALKEY_PORT=6379
        networks:
            - integration_net
        depends_on:
            postgres:
                condition: service_healthy
            valkey:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:8080/health",
                ]
            interval: 5s
            timeout: 3s
            retries: 3
            start_period: 5s

networks:
    integration_net:
        driver: bridge
